
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Voting Platform</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="page-container">
        <section class="shell">
            <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Voting Platform</span></div>
            <div class="form-card">
                <p class="eyebrow">Welcome back</p>
                <h1>Sign in</h1>
                <p class="subtitle">Access your account to cast or review your vote.</p>

            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}

            <form action="/login" method="POST">

                <div class="form-group">
                    <label class="field-label" for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label class="field-label" for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn">
                    Sign in
                </button>

            </form>

            <p class="footer-text">
                New here? <a href="/register">Create an account</a>
            </p>

            </div>
        </section>
    </main>

</body>
</html>
